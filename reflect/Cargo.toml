[package]
name = "unknown"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = false
lto = true
opt-level = "z"
overflow-checks = false
strip = "symbols"
debug-assertions = false
panic = "abort"
rpath = false
codegen-units = 1

[profile.dev]
debug = false
lto = true
opt-level = "z"
overflow-checks = false
strip = "symbols"
debug-assertions = false
panic = "abort"
rpath = false
codegen-units = 1


[dependencies]
winapi = { version = "0.3.9", features = ["winnt", "ntdef", "winbase"] }
ntapi = "0.4.0"
anyhow = "1.0"
hc-256 = "0.5.0"
cipher = "0.5.0-rc.5"
