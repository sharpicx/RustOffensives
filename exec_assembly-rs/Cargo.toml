[package]
name = "DVbhDnWAYsUaoZUZmNlw"
version = "1.0.0"
edition = "2024"
authors = ["sharpicx"]

[dependencies]
windows = { version = "0.54.0", features = [
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_System_Ole",
  "Win32_System_Memory",
] }
dotnet = { path = "./dotnet", default-features = true }
rc4 = "0.1.0"
base64 = "0.13.0"
sysinfo = "0.30.5"
clap = { version = "4.5.0", features = ["derive"] }
kernel32-sys = "0.2.2"
winapi = { version = "0.3.9", features = [
  "ntdef",
  "ntstatus",
  "minwindef",
  "winnt",
  "processthreadsapi",
  "memoryapi",
  "handleapi",
  "libloaderapi",
  "errhandlingapi",
  "winbase",
] }
widestring = "0.4.3"
ntapi = { version = "0.4.1" }
typenum = "1.19.0"

[profile.release]
pic = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
