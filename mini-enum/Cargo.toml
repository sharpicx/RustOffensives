[package]
name = "mini-enum"
version = "0.1.0"
edition = "2024"

[dependencies]
wmi = "0.18.0"
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.1.1"
winreg = "0.10"
winreg_new = { package = "winreg", version = "0.55.0" }
winapi = { version = "0.3.9", features = [
  "winuser",
  "ntdef",
  "ntstatus",
  "minwindef",
  "winnt",
  "processthreadsapi",
  "memoryapi",
  "handleapi",
  "libloaderapi",
  "errhandlingapi",
  "winbase",
  "lmaccess",
  "lmapibuf",
  "windef",
  "wingdi",
  "wbemcli",
  "objbase",
  "oleauto",
  "combaseapi",
  "objidl",
  "winver",
  "minwinbase",
  "fileapi",
  "aclapi",
  "accctrl",
  "winerror",
  "sddl",
  "securitybaseapi",
] }
regex = { version = "1.12.2" }
windows_62_2 = { package = "windows", version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_System_Ole",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }
windows_alt = { package = "windows", version = "=0.60", features = [
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
] }
chrono = "0.4.42"
widestring = "1.2.1"
windows-core = "0.60.0"
windows_old = { package = "windows", version = "0.48.0", features = [
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_UI",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_System_SystemServices",
  "Win32_System_Diagnostics_Debug",
  "Win32_Networking_WinSock",
  "Win32_System_Wmi",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Ole",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
uuid = "1.19.0"

[profile.release]
debug = false
lto = true
opt-level = "z"
overflow-checks = false
strip = "symbols"
debug-assertions = false
panic = "abort"
rpath = false
codegen-units = 1

[profile.dev]
debug = false
lto = true
opt-level = "z"
overflow-checks = false
strip = "symbols"
debug-assertions = false
panic = "abort"
rpath = false
codegen-units = 1
